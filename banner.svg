<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;display=swap');
      .bg { fill: #07090e; }
      .grid { stroke: #161b22; stroke-width: 0.75; }
      .border { fill: none; stroke: #30363d; stroke-width: 1.2; }
      .corner { stroke: #58a6ff; stroke-width: 2; fill: none; }
      .title { fill: #ffffff; font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
      .tag { fill: #58a6ff; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; }
      .subtitle { fill: #8b949e; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 400; }
      .metric-label { fill: #6e7681; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px; }
      .metric-val { fill: #f0f6fc; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
      .status-dot { fill: #3fb950; }
      .status-text { fill: #3fb950; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
      .accent-line { stroke: #58a6ff; stroke-width: 1; opacity: 0.6; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" class="bg"/>

  <!-- Technical Grid -->
  <g opacity="0.6">
    <line x1="0" y1="40" x2="900" y2="40" class="grid"/>
    <line x1="0" y1="80" x2="900" y2="80" class="grid"/>
    <line x1="0" y1="120" x2="900" y2="120" class="grid"/>
    <line x1="0" y1="160" x2="900" y2="160" class="grid"/>
    <line x1="120" y1="0" x2="120" y2="200" class="grid"/>
    <line x1="300" y1="0" x2="300" y2="200" class="grid"/>
    <line x1="480" y1="0" x2="480" y2="200" class="grid"/>
    <line x1="660" y1="0" x2="660" y2="200" class="grid"/>
    <line x1="840" y1="0" x2="840" y2="200" class="grid"/>
  </g>

  <!-- Outer Frame -->
  <rect x="8" y="8" width="884" height="184" class="border" rx="2"/>

  <!-- Corner Brackets -->
  <path d="M 8,24 L 8,8 L 24,8" class="corner"/>
  <path d="M 892,24 L 892,8 L 876,8" class="corner"/>
  <path d="M 8,176 L 8,192 L 24,192" class="corner"/>
  <path d="M 892,176 L 892,192 L 876,192" class="corner"/>

  <!-- Top System Header -->
  <text x="32" y="30" class="tag">// OPERATOR_ID: SACHIN YADAV</text>
  <circle cx="810" cy="27" r="4" class="status-dot"/>
  <text x="822" y="30" class="status-text">AVAILABLE</text>

  <!-- Divider Line -->
  <line x1="32" y1="42" x2="868" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- Hero Typography -->
  <text x="32" y="86" class="title">SACHIN YADAV</text>
  <text x="32" y="112" class="subtitle">Full-Stack &amp; Applied AI Engineer · Civic Platforms · Edge IoT</text>

  <!-- Focus Tags -->
  <g transform="translate(32, 134)">
    <rect x="0" y="0" width="138" height="24" fill="#161b22" stroke="#30363d" stroke-width="1" rx="3"/>
    <text x="12" y="16" fill="#e6edf3" font-family="'JetBrains Mono', monospace" font-size="11px">React &amp; Next.js</text>

    <rect x="146" y="0" width="144" height="24" fill="#161b22" stroke="#30363d" stroke-width="1" rx="3"/>
    <text x="12" y="16" transform="translate(146, 0)" fill="#e6edf3" font-family="'JetBrains Mono', monospace" font-size="11px">Applied AI Agents</text>

    <rect x="298" y="0" width="130" height="24" fill="#161b22" stroke="#30363d" stroke-width="1" rx="3"/>
    <text x="12" y="16" transform="translate(298, 0)" fill="#e6edf3" font-family="'JetBrains Mono', monospace" font-size="11px">Python &amp; Node</text>

    <rect x="436" y="0" width="120" height="24" fill="#161b22" stroke="#30363d" stroke-width="1" rx="3"/>
    <text x="12" y="16" transform="translate(436, 0)" fill="#e6edf3" font-family="'JetBrains Mono', monospace" font-size="11px">ESP32 &amp; MQTT</text>
  </g>

  <!-- Right Meta Telemetry Block -->
  <g transform="translate(620, 68)">
    <rect x="0" y="0" width="248" height="90" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="3"/>
    
    <text x="16" y="24" class="metric-label">CURRENT_BASE</text>
    <text x="16" y="40" class="metric-val">Navi Mumbai, IN 🇮🇳</text>

    <line x1="16" y1="48" x2="232" y2="48" stroke="#161b22" stroke-width="1"/>

    <text x="16" y="66" class="metric-label">PRIMARY_OBJECTIVE</text>
    <text x="16" y="82" class="metric-val">SDE / Applied AI Intern</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="32" y1="180" x2="868" y2="180" class="accent-line"/>
</svg>

